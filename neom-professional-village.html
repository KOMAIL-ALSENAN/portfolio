<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="NEOM Professional Village BIM project by Komail Alsenan, Architecture BIM Modeler."><meta name="theme-color" content="#07111f"><meta property="og:type" content="website"><meta property="og:site_name" content="KOMAIL ALSENAN"><meta property="og:title" content="NEOM Professional Village | Komail Alsenan"><meta property="og:description" content="Architectural BIM modeling and documentation across NEOM Professional Village buildings."><meta property="og:image" content="https://komail-alsenan.github.io/portfolio/assets/social-card-v1.jpg"><meta property="og:url" content="https://komail-alsenan.github.io/portfolio/neom-professional-village.html"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://komail-alsenan.github.io/portfolio/assets/social-card-v1.jpg"><link rel="canonical" href="https://komail-alsenan.github.io/portfolio/neom-professional-village.html"><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/css/main.css"><link rel="stylesheet" href="assets/css/project-gallery.css"><title>NEOM Professional Village | Komail Alsenan</title><meta name="robots" content="index,follow,max-image-preview:large"><style>:root{--bg:#050b14;--surface:#0b1627;--line:rgba(145,190,235,.16);--text:#f1f7ff;--muted:#96abc2;--cyan:#4cd7ff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 85% 5%,rgba(36,147,255,.16),transparent 27%),var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7;overflow-x:hidden}.container{width:min(1080px,calc(100% - 40px));margin:auto}a{color:inherit;text-decoration:none}.nav{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:rgba(5,11,20,.86);backdrop-filter:blur(18px)}.nav-inner{height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800}.actions{display:flex;gap:9px}.nav-btn{min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font:inherit;cursor:pointer}.mark{display:inline-grid;place-items:center;width:38px;height:38px;margin-inline-end:10px;border:1px solid rgba(76,215,255,.35);border-radius:12px;color:var(--cyan)}.hero{padding:72px 0 36px}.tag{color:var(--cyan);font-weight:800;letter-spacing:1.4px;font-size:.82rem}.hero h1{font-size:clamp(2.7rem,7vw,5.6rem);line-height:1;margin:14px 0 20px;letter-spacing:-.045em}.lead{max-width:760px;color:var(--muted);font-size:1.08rem}.panel{margin:24px 0 70px;padding:28px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(16,31,53,.92),rgba(11,22,39,.75))}.buildings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.building{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:rgba(5,11,20,.4);display:flex;flex-direction:column}.cover{aspect-ratio:1.35/1;overflow:hidden;background:#fff;border-bottom:1px solid var(--line)}.cover img{width:100%;height:100%;object-fit:cover;display:block}.body{padding:19px;display:flex;flex-direction:column;flex:1}.body h2{margin:0 0 8px}.body p{margin:0 0 16px;color:var(--muted);font-size:.92rem}.view{margin-top:auto;display:inline-flex;color:var(--cyan);font-weight:800;min-height:44px;align-items:center}.gallery-section{display:none;margin-top:30px}.gallery-section.active{display:block}.gallery-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.gallery-head h2{margin:0}.close-gallery{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 13px;cursor:pointer}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}html[dir=rtl] body{font-family:Tahoma,"Segoe UI",Arial,sans-serif;text-align:right}html[dir=rtl] .tag{letter-spacing:0}@media(max-width:680px){.gallery,.buildings{grid-template-columns:1fr}}@media(max-width:580px){.container{width:min(100% - 24px,1080px)}.nav-inner{height:62px}.actions a{display:none}.hero{padding:42px 0 24px}.panel{padding:18px}}</style></head><body><nav class="nav" aria-label="Primary navigation"><div class="container nav-inner"><a class="brand" href="index.html"><span class="mark">KA</span>KOMAIL ALSENAN</a><div class="actions"><a class="nav-btn" href="neom.html" data-en="Back to NEOM" data-ar="العودة إلى NEOM">Back to NEOM</a><button class="nav-btn" id="langBtn" type="button" aria-label="Switch language">العربية</button></div></div></nav><main class="container" id="main-content"><header class="hero"><div class="tag" data-en="NEOM · PROFESSIONAL VILLAGE · BIM" data-ar="NEOM · القرية المهنية · BIM">NEOM · PROFESSIONAL VILLAGE · BIM</div><h1 data-en="NEOM Professional Village" data-ar="قرية NEOM المهنية">NEOM Professional Village</h1><p class="lead" data-en="Architectural BIM modeling and documentation organized across four buildings: B05, B06, B07 and B09." data-ar="نمذجة وتوثيق BIM معماري منظم لأربعة مبانٍ: B05 وB06 وB07 وB09.">Architectural BIM modeling and documentation organized across four buildings: B05, B06, B07 and B09.</p></header><section class="panel"><div class="buildings" id="buildings"></div><div id="galleries"></div></section></main><script src="assets/js/project-gallery.js"></script><script>const data=[{id:'b05',name:'B05',count:11,en:'Architectural BIM drawings and documentation for Building B05.',ar:'لوحات وتوثيق BIM معماري للمبنى B05.'},{id:'b06',name:'B06',count:9,en:'Architectural BIM drawings and documentation for Building B06.',ar:'لوحات وتوثيق BIM معماري للمبنى B06.'},{id:'b07',name:'B07',count:9,en:'Architectural BIM drawings and documentation for Building B07.',ar:'لوحات وتوثيق BIM معماري للمبنى B07.'},{id:'b09',name:'B09',count:10,en:'Architectural BIM drawings and documentation for Building B09.',ar:'لوحات وتوثيق BIM معماري للمبنى B09.'}];const buildingRoot=document.getElementById('buildings'),galleryRoot=document.getElementById('galleries'),btn=document.getElementById('langBtn');function lang(){return document.documentElement.lang==='ar'?'ar':'en'}function render(){const ar=lang()==='ar';buildingRoot.innerHTML=data.map(b=>`<article class="building"><div class="cover"><img src="assets/projects/neom/professional-village/${b.id}/${b.id}-01.jpg" alt="NEOM Professional Village ${b.name}"></div><div class="body"><h2>${b.name}</h2><p>${ar?b.ar:b.en}</p><a class="view" href="#${b.id}-gallery" data-open="${b.id}">${ar?'عرض المعرض ←':'View gallery →'}</a></div></article>`).join('');galleryRoot.innerHTML=data.map(b=>`<div class="gallery-section" id="${b.id}-gallery"><div class="gallery-head"><h2>${b.name} ${ar?'معرض':'Gallery'}</h2><button class="close-gallery" type="button">${ar?'إغلاق المعرض':'Close gallery'}</button></div><div class="gallery" id="${b.id}Grid"></div></div>`).join('');for(const b of data){const items=Array.from({length:b.count},(_,i)=>`assets/projects/neom/professional-village/${b.id}/${b.id}-${String(i+1).padStart(2,'0')}.jpg`);const grid=document.getElementById(b.id+'Grid');grid.innerHTML=items.map((src,i)=>`<button class="pg-card" type="button" data-pg-image="${src}" data-pg-alt="${b.name} project image ${i+1}" data-pg-caption="${b.name} · ${i+1} / ${items.length}"><img src="${src}" alt="${b.name} project image ${i+1}" loading="lazy" decoding="async"></button>`).join('');window.ProjectGallery.bind(grid)}document.querySelectorAll('[data-open]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();document.querySelectorAll('.gallery-section').forEach(s=>s.classList.remove('active'));const t=document.getElementById(a.dataset.open+'-gallery');t.classList.add('active');t.scrollIntoView({behavior:'smooth',block:'start'})}));document.querySelectorAll('.close-gallery').forEach(b=>b.onclick=()=>b.closest('.gallery-section').classList.remove('active'))}function setLang(next){const l=next==='ar'?'ar':'en',ar=l==='ar';document.documentElement.lang=l;document.documentElement.dir=ar?'rtl':'ltr';document.body.dir=document.documentElement.dir;document.querySelectorAll('[data-en][data-ar]').forEach(el=>el.textContent=el.getAttribute(ar?'data-ar':'data-en'));btn.textContent=ar?'English':'العربية';localStorage.setItem('portfolio-lang',l);localStorage.setItem('portfolio-language',l);render()}setLang(localStorage.getItem('portfolio-lang')||localStorage.getItem('portfolio-language')||'en');btn.onclick=()=>setLang(lang()==='ar'?'en':'ar');</script><script src="assets/js/main.js" defer></script></body></html>
