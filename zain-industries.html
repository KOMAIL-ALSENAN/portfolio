<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="ZAIN INDUSTRIES BIM project portfolio by Komail Al Senan">
<title>ZAIN INDUSTRIES | Komail Al Senan</title>
<style>
:root{--bg:#050b14;--surface:#0b1627;--line:rgba(145,190,235,.16);--text:#f1f7ff;--muted:#96abc2;--blue:#2493ff;--cyan:#4cd7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 5%,rgba(36,147,255,.16),transparent 27%),var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}.container{width:min(1020px,calc(100% - 40px));margin:auto}a{color:inherit;text-decoration:none}.nav{position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);background:rgba(5,11,20,.86);backdrop-filter:blur(18px)}.nav-inner{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800}.mark{display:inline-grid;place-items:center;width:38px;height:38px;margin-inline-end:10px;border:1px solid rgba(76,215,255,.35);border-radius:12px;color:var(--cyan)}.back{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px}.hero{padding:62px 0 34px}.logo{width:min(320px,70vw);max-height:150px;object-fit:contain;background:#fff;border-radius:18px;padding:18px;margin-bottom:26px}.tag{color:var(--cyan);font-weight:800;letter-spacing:1.4px;font-size:.82rem}.hero h1{font-size:clamp(3rem,8vw,6rem);line-height:1;margin:14px 0 20px;letter-spacing:-.045em}.lead{max-width:760px;color:var(--muted);font-size:1.08rem}.panel{margin:24px 0 70px;padding:28px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(16,31,53,.92),rgba(11,22,39,.75))}.buildings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.building{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:rgba(5,11,20,.4)}.building-cover{width:100%;aspect-ratio:1.35/1;object-fit:cover;background:#fff;border-bottom:1px solid var(--line)}.body{padding:19px}.body h2{margin:0 0 8px}.body p{margin:0 0 14px;color:var(--muted);font-size:.92rem}.view{display:inline-flex;min-height:44px;align-items:center;color:var(--cyan);font-weight:800}.gallery{display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}.gallery.open{display:grid}.gallery button{padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;cursor:zoom-in}.gallery img{display:block;width:100%;height:auto}.placeholder{min-height:180px;display:grid;place-items:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}.lightbox{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.92);padding:18px}.lightbox.open{display:flex}.lightbox img{max-width:92vw;max-height:88vh;object-fit:contain}.ctrl{position:absolute;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(5,11,20,.76);color:#fff;font-size:1.5rem}.close{top:18px;right:18px}.prev{left:18px;top:50%}.next{right:18px;top:50%}.counter{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(5,11,20,.76);padding:6px 11px;border-radius:999px}.note{margin-top:22px;color:var(--muted)}@media(max-width:700px){.buildings,.gallery{grid-template-columns:1fr}}@media(max-width:580px){.container{width:min(100% - 24px,1020px)}.nav-inner{height:60px}.hero{padding:40px 0 24px}.panel{padding:18px}.hero h1{font-size:clamp(2.4rem,14vw,3.6rem)}}
</style>
</head>
<body>
<nav class="nav"><div class="container nav-inner"><a class="brand" href="index.html"><span class="mark">KA</span>KOMAIL</a><a class="back" href="index.html#projects">Back to projects</a></div></nav>
<main class="container">
<header class="hero"><img class="logo" src="assets/projects/zain-industries/ZAIN INDUSTRIES LOGO.webp" alt="ZAIN INDUSTRIES logo"><div class="tag">ZAIN INDUSTRIES · BIM · INDUSTRIAL</div><h1>ZAIN INDUSTRIES</h1><p class="lead">Industrial BIM documentation and coordinated project work organized by building and facility.</p></header>
<section class="panel"><div class="buildings" id="buildings"></div><p class="note">A third building folder remains available for future project content.</p></section>
</main>
<div class="lightbox" id="lightbox"><img id="lightboxImage" alt=""><button class="ctrl close" id="close">×</button><button class="ctrl prev" id="prev">‹</button><button class="ctrl next" id="next">›</button><div class="counter" id="counter"></div></div>
<script>
const data=[
 {name:'Warehouse',folder:'warehouse',count:15,description:'Warehouse BIM modeling, drawings, and project documentation.'},
 {name:'HCL Tank Farm',folder:'hcl-tank-farm',count:5,description:'HCL Tank Farm BIM drawings and industrial facility documentation.'}
];
const root=document.getElementById('buildings');let active=[],idx=0;
for(const b of data){const images=Array.from({length:b.count},(_,i)=>`assets/projects/zain-industries/${b.folder}/${b.folder}-${String(i+1).padStart(2,'0')}.jpg`);const card=document.createElement('article');card.className='building';card.innerHTML=`<img class="building-cover" src="${images[0]}" alt="${b.name}"><div class="body"><h2>${b.name}</h2><p>${b.description}</p><a class="view" href="#">View gallery →</a><div class="gallery">${images.map((src,i)=>`<button type="button" data-i="${i}"><img src="${src}" alt="${b.name} ${i+1}" loading="lazy"></button>`).join('')}</div></div>`;const gallery=card.querySelector('.gallery');card.querySelector('.view').addEventListener('click',e=>{e.preventDefault();gallery.classList.toggle('open');e.currentTarget.textContent=gallery.classList.contains('open')?'Hide gallery ↑':'View gallery →'});gallery.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>open(images,Number(btn.dataset.i))));root.appendChild(card)}
const lb=document.getElementById('lightbox'),img=document.getElementById('lightboxImage'),counter=document.getElementById('counter');function show(){img.src=active[idx];counter.textContent=`${idx+1} / ${active.length}`}function open(images,i){active=images;idx=i;show();lb.classList.add('open');document.body.style.overflow='hidden'}function close(){lb.classList.remove('open');document.body.style.overflow='';img.removeAttribute('src')}document.getElementById('close').onclick=close;document.getElementById('prev').onclick=()=>{idx=(idx-1+active.length)%active.length;show()};document.getElementById('next').onclick=()=>{idx=(idx+1)%active.length;show()};lb.addEventListener('click',e=>{if(e.target===lb)close()});document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')document.getElementById('prev').click();if(e.key==='ArrowRight')document.getElementById('next').click()});
</script>
</body></html>
