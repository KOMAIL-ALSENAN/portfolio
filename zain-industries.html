gap:12px}.brand{font-weight:800}.mark{display:inline-grid;place-items:center;width:38px;height:38px;margin-inline-end:10px;border:1px solid rgba(76,215,255,.35);border-radius:12px;color:var(--cyan)}.actions{display:flex;gap:9px}.nav-btn{min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font:inherit;cursor:pointer}.hero{padding:62px 0 34px}.logo{width:min(320px,70vw);max-height:150px;object-fit:contain;background:#fff;border-radius:18px;padding:18px;margin-bottom:26px}.tag{color:var(--cyan);font-weight:800;letter-spacing:1.4px;font-size:.82rem}.hero h1{font-size:clamp(3rem,8vw,6rem);line-height:1;margin:14px 0 20px;letter-spacing:-.045em}.lead{max-width:760px;color:var(--muted);font-size:1.08rem}.panel{margin:24px 0 70px;padding:28px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(16,31,53,.92),rgba(11,22,39,.75))}.buildings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.building{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:rgba(5,11,20,.4)}.building-cover{width:100%;aspect-ratio:1.35/1;object-fit:cover;background:#fff;border-bottom:1px solid var(--line)}.body{padding:19px}.body h2{margin:0 0 8px}.body p{margin:0 0 14px;color:var(--muted);font-size:.92rem}.view{display:inline-flex;border:0;background:transparent;padding:0;cursor:pointer;min-height:44px;align-items:center;color:var(--cyan);font-weight:800}.gallery{display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}.gallery.open{display:grid}html[dir=rtl] body{font-family:Tahoma,"Segoe UI",Arial,sans-serif;text-align:right}html[dir=rtl] .tag{letter-spacing:0}@media(max-width:700px){.buildings,.gallery{grid-template-columns:1fr}}@media(max-width:580px){.container{width:min(100% - 24px,1020px)}.nav-inner{height:62px}.actions a{display:none}.hero{padding:40px 0 24px}.panel{padding:18px}.hero h1{font-size:clamp(2.4rem,14vw,3.6rem)}}</style></head><body><nav class="nav" aria-label="Primary navigation"><div class="container nav-inner"><a class="brand" href="index.html"><span class="mark">KA</span>KOMAIL ALSENAN</a><div class="actions"><a class="nav-btn" href="projects.html" data-en="All Projects" data-ar="كل المشاريع">All Projects</a><button class="nav-btn" id="langBtn" type="button" aria-label="Switch language">العربية</button></div></div></nav><main class="container" id="main-content"><header class="hero"><img class="logo" src="assets/projects/zain-industries/ZAIN INDUSTRIES LOGO.webp" alt="ZAIN INDUSTRIES logo"><div class="tag" data-en="ZAIN INDUSTRIES · BIM · INDUSTRIAL" data-ar="ZAIN INDUSTRIES · BIM · صناعي">ZAIN INDUSTRIES · BIM · INDUSTRIAL</div><h1>ZAIN INDUSTRIES</h1><p class="lead" data-en="Industrial BIM documentation and coordinated project work organized by building and facility." data-ar="أعمال توثيق وتنسيق BIM لمشروع صناعي، منظمة حسب المبنى والمنشأة.">Industrial BIM documentation and coordinated project work organized by building and facility.</p></header><section class="panel"><div class="buildings" id="buildings"></div></section></main><script src="assets/js/project-gallery.js"></script><script>const data=[{name:'Warehouse',nameAr:'المستودع',folder:'warehouse',count:15,en:'Warehouse BIM modeling, drawings and project documentation.',ar:'نمذجة BIM ولوحات وتوثيق مشروع المستودع.'},{name:'HCL Tank Farm',nameAr:'منطقة خزانات HCL',folder:'hcl-tank-farm',count:5,en:'HCL Tank Farm BIM drawings and industrial facility documentation.',ar:'لوحات BIM وتوثيق المنشأة الصناعية لمنطقة خزانات HCL.'}];const root=document.getElementById('buildings'),btn=document.getElementById('langBtn');function lang(){return document.documentElement.lang==='ar'?'ar':'en'}function render(){const ar=lang()==='ar';root.innerHTML='';for(const b of data){const images=Array.from({length:b.count},(_,i)=>`assets/projects/zain-industries/${b.folder}/${b.folder}-${String(i+1).padStart(2,'0')}.jpg`);const card=document.createElement('article');card.className='building';card.innerHTML=`<img class="building-cover" src="${images[0]}" alt="${b.name} BIM project"><div class="body"><h2>${ar?b.nameAr:b.name}</h2><p>${ar?b.ar:b.en}</p><button class="view" type="button">${ar?'عرض المعرض ←':'View gallery →'}</button><div class="gallery">${images.map((src,i)=>`<button class="pg-card" type="button" data-pg-image="${src}" data-pg-alt="${b.name} project image ${i+1}" data-pg-caption="${b.name} · ${i+1} / ${images.length}"><img src="${src}" alt="${b.name} project image ${i+1}" loading="lazy" decoding="async"></button>`).join('')}</div></div>`;const gallery=card.querySelector('.gallery'),toggle=card.querySelector('.view');toggle.addEventListener('click',()=>{gallery.classList.toggle('open');toggle.textContent=gallery.classList.contains('open')?(ar?'إخفاء المعرض ↑':'Hide gallery ↑'):(ar?'عرض المعرض ←':'View gallery →')});root.appendChild(card);window.ProjectGallery.bind(card)}}function setLang(next){const l=next==='ar'?'ar':'en',ar=l==='ar';document.documentElement.lang=l;document.documentElement.dir=ar?'rtl':'ltr';document.body.dir=document.documentElement.dir;document.querySelectorAll('[data-en][data-ar]').forEach(el=>el.textContent=el.getAttribute(ar?'data-ar':'data-en'));btn.textContent=ar?'English':'العربية';localStorage.setItem('portfolio-lang',l);localStorage.setItem('portfolio-language',l);render()}setLang(localStorage.getItem('portfolio-lang')||localStorage.getItem('portfolio-language')||'en');btn.onclick=()=>setLang(lang()==='ar'?'en':'ar');</script><script src="assets/js/main.js" defer></script></body></html>
