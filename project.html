function moveGallery(step){if(galleryImages.length<2)return;galleryIndex=(galleryIndex+step+galleryImages.length)%galleryImages.length;updateLightbox()}
function bindGallery(){elements.content.querySelectorAll('[data-gallery-index]').forEach(button=>button.addEventListener('click',()=>openGallery(Number(button.dataset.galleryIndex))))}
function renderSections(ar){galleryImages=[];const nav=project.sections.map((s,i)=>`<a class="section-jump" href="#nesma-${i}">${s.code}</a>`).join('');let offset=0;const body=project.sections.map((s,i)=>{const start=offset;const imgs=s.images.map(name=>N+encodeURIComponent(s.code).replace(/%2F/g,'/')+'/'+encodeURIComponent(name).replace(/%2F/g,'/'));galleryImages.push(...imgs);offset+=imgs.length;return `<section class="drawing-section" id="nesma-${i}"><div class="section-title"><div><div class="section-code">${s.code}</div><h2>${ar?s.ar:s.en}</h2></div><div class="section-count">${imgs.length} ${ar?'لوحة':'drawings'}</div></div><div class="gallery ${imgs.length===1?'single':''}">${imgs.map((src,j)=>`<button type="button" data-gallery-index="${start+j}" aria-label="${ar?'فتح اللوحة':'Open drawing'} ${j+1}"><img src="${src}" alt="${project.title} — ${s.code} — ${j+1}" loading="lazy"></button>`).join('')}</div></section>`}).join('');return `<nav class="project-sections" aria-label="${ar?'أقسام المشروع':'Project sections'}">${nav}</nav>${body}`}
function render(){const ar=lang==='ar';document.documentElement.lang=lang;document.documentElement.dir=ar?'rtl':'ltr';document.body.dir=ar?'rtl':'ltr';elements.langBtn.textContent=ar?'English':'العربية';if(!project){galleryImages=[];elements.tag.textContent='PROJECT';elements.title.textContent=ar?'المشروع غير موجود':'Project not found';elements.description.textContent=ar?'تعذر العثور على المشروع المطلوب.':'The requested project could not be found.';elements.content.innerHTML=`<div class="actions"><a class="back primary" href="projects.html">${ar?'العودة إلى المشاريع':'Back to projects'}</a></div>`;return}const visibleTitle=ar&&project.titleAr?project.titleAr:project.title;document.title=visibleTitle+' | Komail Alsenan';elements.tag.textContent=project.tag;elements.title.textContent=visibleTitle;elements.description.textContent=project[lang];let media='';if(project.sections){media=renderSections(ar)}else{galleryImages=project.images||[];if(project.buildings){media=`<h2 class="gallery-heading">${ar?'مباني المشروع':'Project buildings'}</h2><div class="buildings">${project.buildings.map(b=>`<article class="building"><img src="${b.image}" alt="${b.title} project image" loading="lazy"><div class="building-body"><h2>${b.title}</h2><p>${b[lang]}</p><a class="building-link" href="project.html?id=${b.id}">${ar?'عرض المبنى ←':'View building →'}</a></div></article>`).join('')}</div>`}else if(project.images){media=`<h2 class="gallery-heading">${ar?'صور ولوحات المشروع':'Project drawings and images'}</h2><div class="gallery ${project.images.length===1?'single':''}">${project.images.map((src,i)=>`<button type="button" data-gallery-index="${i}"><img src="${src}" alt="${project.title} project image ${i+1}" loading="lazy"></button>`).join('')}</div>`}else{media=`<div class="placeholder">${ar?'سيتم إضافة محتوى المشروع قريبًا.':'Project content will be added soon.'}</div>`}}const backHref=project.parent?`project.html?id=${project.parent}`:'projects.html';const backText=project.parent?(ar?'العودة إلى مشروع القدية →':'← Back to Qiddiya Project'):(ar?'العودة إلى المشاريع →':'← Back to projects');elements.content.innerHTML=media+`<div class="actions"><a class="back primary" href="${backHref}">${backText}</a><a class="back" href="index.html">${ar?'الصفحة الرئيسية':'Home'}</a></div>`;bindGallery()}
elements.langBtn.addEventListener('click',()=>{lang=lang==='en'?'ar':'en';localStorage.setItem('portfolio-lang',lang);localStorage.setItem('portfolio-language',lang);closeGallery();render()});lightbox.close.addEventListener('click',closeGallery);lightbox.prev.addEventListener('click',()=>moveGallery(-1));lightbox.next.addEventListener('click',()=>moveGallery(1));lightbox.root.addEventListener('click',e=>{if(e.target===lightbox.root)closeGallery()});document.addEventListener('keydown',e=>{if(!lightbox.root.classList.contains('open'))return;if(e.key==='Escape')closeGallery();if(e.key==='ArrowLeft')moveGallery(-1);if(e.key==='ArrowRight')moveGallery(1)});lightbox.stage.addEventListener('touchstart',e=>{touchStartX=e.changedTouches[0].clientX},{passive:true});lightbox.stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchStartX;if(Math.abs(dx)>50)moveGallery(dx>0?-1:1)},{passive:true});render();
</script><script src="assets/js/dynamic-project-case-study.js"></script><script src="assets/js/main.js" defer></script>
