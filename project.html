<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Komail Al Senan architecture and BIM project">
  <title>Project | Komail Al Senan</title>
  <style>
    :root{--bg:#050b14;--surface:#0b1627;--line:rgba(145,190,235,.16);--text:#f1f7ff;--muted:#96abc2;--blue:#2493ff;--cyan:#4cd7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 5%,rgba(36,147,255,.16),transparent 27%),var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}body[dir=rtl]{font-family:Tahoma,"Segoe UI",Arial,sans-serif}.container{width:min(980px,calc(100% - 40px));margin:auto}a{color:inherit;text-decoration:none}.nav{border-bottom:1px solid var(--line);background:rgba(5,11,20,.86);position:sticky;top:0;z-index:10;backdrop-filter:blur(18px)}.nav-inner{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800}.mark{display:inline-grid;place-items:center;width:38px;height:38px;margin-inline-end:10px;border:1px solid rgba(76,215,255,.35);border-radius:12px;color:var(--cyan)}button,.back{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:9px 14px;border-radius:10px;cursor:pointer}.hero{padding:86px 0 42px}.tag{color:var(--cyan);font-weight:800;letter-spacing:1.4px;font-size:.82rem}.hero h1{font-size:clamp(2.7rem,7vw,5.8rem);line-height:1;margin:16px 0 24px;letter-spacing:-.045em}.lead{max-width:760px;color:var(--muted);font-size:1.15rem}.panel{margin:30px 0 80px;padding:32px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(16,31,53,.92),rgba(11,22,39,.75))}.cover{width:100%;max-height:620px;object-fit:cover;border-radius:16px;margin-bottom:25px}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.gallery a{display:block;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.gallery img{display:block;width:100%;aspect-ratio:1.414/1;object-fit:cover;transition:transform .25s}.gallery a:hover img{transform:scale(1.018)}.gallery-heading{margin:0 0 20px;font-size:1.35rem}.buildings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.building{display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:rgba(5,11,20,.4)}.building img{display:block;width:100%;aspect-ratio:1.414/1;object-fit:cover;background:#fff;border-bottom:1px solid var(--line)}.building-body{padding:20px}.building h2{margin:0 0 8px;font-size:1.35rem}.building p{margin:0 0 16px;color:var(--muted)}.building-link{color:var(--cyan);font-weight:800}.placeholder{min-height:280px;display:grid;place-items:center;text-align:center;border:1px dashed rgba(76,215,255,.3);border-radius:16px;color:var(--muted);background:rgba(5,11,20,.35);padding:30px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.back.primary{background:linear-gradient(135deg,var(--blue),#1264ff);border-color:transparent;font-weight:700}@media(max-width:700px){.gallery,.buildings{grid-template-columns:1fr}}@media(max-width:580px){.container{width:min(100% - 28px,980px)}.hero{padding-top:56px}.panel{padding:20px}}
  </style>
</head>
<body>
  <nav class="nav"><div class="container nav-inner"><a class="brand" href="index.html"><span class="mark">KA</span>KOMAIL</a><button id="langBtn">العربية</button></div></nav>
  <main class="container"><header class="hero"><div class="tag" id="tag"></div><h1 id="title"></h1><p class="lead" id="description"></p></header><section class="panel" id="content"></section></main>
  <script>
    const projects={
      "qiddiya":{title:"Qiddiya Project",titleAr:"مشروع القدية",tag:"BIM · ARCHITECTURE",buildings:[{id:"qiddiya-b01",title:"B01 – Worker Accommodation",titleAr:"B01 – سكن العمال",cover:"assets/projects/qiddiya/b01/b01-01.jpg",en:"Architectural construction drawings for the worker accommodation building.",ar:"اللوحات المعمارية التنفيذية لمبنى سكن العمال."}],en:"Architectural BIM work for the Qiddiya Construction Workers Village.",ar:"أعمال BIM معمارية لقرية عمال الإنشاءات في القدية."},
      "qiddiya-b01":{title:"B01 – Worker Accommodation",titleAr:"B01 – سكن العمال",tag:"ARCHITECTURE · ISSUED FOR CONSTRUCTION",images:Array.from({length:14},(_,i)=>`assets/projects/qiddiya/b01/b01-${String(i+1).padStart(2,"0")}.jpg`),parent:"qiddiya",en:"Fourteen architectural construction drawings for Building B01 in the Qiddiya Construction Workers Village.",ar:"أربع عشرة لوحة معمارية تنفيذية لمبنى B01 ضمن قرية عمال الإنشاءات في القدية."},
      "red-sea-turtle-bay-village":{title:"Red Sea Turtle Bay Village",tag:"MASTER PLANNING",images:Array.from({length:10},(_,i)=>`assets/projects/red-sea-turtle-bay-village/red-sed-${String(i+1).padStart(4,"0")}.jpg`),en:"A coastal village design study covering site planning, architectural development, and project presentation.",ar:"دراسة تصميمية لقرية ساحلية تشمل تخطيط الموقع والتطوير المعماري وإظهار المشروع."},
      "nesma-car-parking-building":{title:"Nesma Car Parking Building",tag:"ARCHITECTURE",en:"Architectural design and documentation for a multi-level car parking facility.",ar:"تصميم وتوثيق معماري لمبنى مواقف سيارات متعدد الطوابق."},
      "villa-1":{title:"Villa 1",tag:"RESIDENTIAL",en:"Residential villa design including plans, elevations, and architectural presentation.",ar:"تصميم فيلا سكنية يشمل المخططات والواجهات والإظهار المعماري."},
      "villa-2":{title:"Villa 2",tag:"RESIDENTIAL",en:"Residential villa design including plans, elevations, and architectural presentation.",ar:"تصميم فيلا سكنية يشمل المخططات والواجهات والإظهار المعماري."},
      "villa-3":{title:"Villa 3",tag:"RESIDENTIAL",en:"Residential villa design including plans, elevations, and architectural presentation.",ar:"تصميم فيلا سكنية يشمل المخططات والواجهات والإظهار المعماري."},
      "villa-4":{title:"Villa 4",tag:"RESIDENTIAL",en:"Residential villa design including plans, elevations, and architectural presentation.",ar:"تصميم فيلا سكنية يشمل المخططات والواجهات والإظهار المعماري."},
      "health-gym":{title:"Health Gym",tag:"FITNESS · INTERIOR",image:"assets/projects/health-gym/health-gym-cover.jpg",en:"A comprehensive health-club project with architectural and interior design studies.",ar:"مشروع متكامل لنادٍ صحي يشمل دراسات العمارة والتصميم الداخلي."},
      "interior-design":{title:"Interior Design",tag:"INTERIOR",en:"Interior spaces developed through layouts, material studies, and visual presentation.",ar:"مساحات داخلية طُوّرت من خلال المخططات ودراسات المواد والإظهار."},
      "photoshop":{title:"Photoshop",tag:"VISUALIZATION",en:"Architectural graphics, post-production, and visual presentation studies.",ar:"رسومات معمارية ودراسات ما بعد الإنتاج والإظهار البصري."}
    };
    const id=new URLSearchParams(location.search).get("id");const project=projects[id]||projects["health-gym"];let lang=localStorage.getItem("portfolio-lang")||"en";
    function render(){const ar=lang==="ar";const displayTitle=ar&&project.titleAr?project.titleAr:project.title;document.documentElement.lang=lang;document.body.dir=ar?"rtl":"ltr";document.title=displayTitle+" | Komail Al Senan";tag.textContent=project.tag;title.textContent=displayTitle;description.textContent=project[lang];langBtn.textContent=ar?"English":"العربية";let media;if(project.buildings){media=`<h2 class="gallery-heading">${ar?"مباني المشروع":"Project buildings"}</h2><div class="buildings">${project.buildings.map(building=>`<article class="building"><img src="${building.cover}" alt="${ar&&building.titleAr?building.titleAr:building.title}" loading="lazy"><div class="building-body"><h2>${ar&&building.titleAr?building.titleAr:building.title}</h2><p>${building[lang]}</p><a class="building-link" href="project.html?id=${building.id}">${ar?"عرض المبنى ←":"View building →"}</a></div></article>`).join("")}</div>`}else if(project.images){media=`<h2 class="gallery-heading">${ar?"صور ولوحات المشروع":"Project drawings and images"}</h2><div class="gallery">${project.images.map((src,i)=>`<a href="${src}" target="_blank" rel="noreferrer"><img src="${src}" alt="${displayTitle} — ${ar?"لوحة":"drawing"} ${i+1}" loading="lazy"></a>`).join("")}</div>`}else if(project.image){media=`<img class="cover" src="${project.image}" alt="${displayTitle}">`}else{media=`<div class="placeholder">${ar?"سيتم إضافة صور وملفات هذا المشروع إلى هذه الصفحة قريبًا.":"Project images and files will be added to this page soon."}</div>`}const backHref=project.parent?`project.html?id=${project.parent}`:"index.html#projects";const backText=project.parent?(ar?"← العودة إلى مشروع القدية":"← Back to Qiddiya Project"):(ar?"← العودة إلى المشاريع":"← Back to projects");content.innerHTML=media+`<div class="actions"><a class="back primary" href="${backHref}">${backText}</a><a class="back" href="index.html">${ar?"الصفحة الرئيسية":"Home"}</a></div>`}
    langBtn.onclick=()=>{lang=lang==="en"?"ar":"en";localStorage.setItem("portfolio-lang",lang);render()};render();
  </script>
</body>
</html>
