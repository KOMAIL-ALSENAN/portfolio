{id:'linkedin',issuer:'LinkedIn Learning',issuerAr:'LinkedIn Learning',items:[['BIM Management: Revit Model Maintenance','assets/certificates/linkedin-learning/bim-management-revit-model-maintenance.jpg',0],['Revit Landscape Architecture BIM Techniques','assets/certificates/linkedin-learning/revit-landscape-architecture-bim-techniques.jpg',0]]}
];
let lang=localStorage.getItem('portfolio-lang')==='ar'?'ar':'en',activeFilter='all',flat=[],currentIndex=0;const wrap=document.getElementById('certificateGroups'),filtersEl=document.getElementById('filters'),lightbox=document.getElementById('lightbox'),lbImage=document.getElementById('lbImage'),counter=document.getElementById('counter');const words={en:{back:'← Back to home',kicker:'Professional development',title:'Certificates',intro:'Credentials prioritized by professional relevance and organized by issuing organization.',count:'certificates',filter:'FILTER THE LIBRARY',all:'All',issued:'Issued by',featured:'Featured'},ar:{back:'العودة إلى الرئيسية →',kicker:'التطوير المهني',title:'الشهادات',intro:'شهادات مرتبة حسب أهميتها المهنية ومصنفة حسب الجهة المانحة.',count:'شهادات',filter:'تصفية الشهادات',all:'الكل',issued:'الجهة المانحة',featured:'مميزة'}};
function totalCount(){return groups.reduce((n,g)=>n+g.items.length,0)}function renderFilters(){const ar=lang==='ar';const buttons=[{id:'all',label:words[lang].all,count:totalCount()},...groups.map(g=>({id:g.id,label:ar?g.issuerAr:g.issuer,count:g.items.length}))];filtersEl.innerHTML=buttons.map(b=>`<button class="filter-btn${activeFilter===b.id?' active':''}" type="button" aria-pressed="${activeFilter===b.id}" data-filter="${b.id}">${b.label}<span>${b.count}</span></button>`).join('');filtersEl.querySelectorAll('.filter-btn').forEach(btn=>btn.addEventListener('click',()=>{activeFilter=btn.dataset.filter;renderFilters();render()}))}
function render(){const ar=lang==='ar';flat=[];const visible=activeFilter==='all'?groups:groups.filter(g=>g.id===activeFilter);wrap.innerHTML=visible.map(g=>{const cards=g.items.map(([title,src,featured])=>{const idx=flat.length;flat.push({title,src});return `<article class="certificate${featured?' featured':''}"><button class="cert-open" type="button" data-index="${idx}" aria-label="${ar?'فتح شهادة':'Open certificate'} ${title}"><img src="${src}" alt="${title} certificate" loading="lazy"></button><div class="certificate-body">${featured?`<span class="featured-badge">${words[lang].featured}</span>`:''}<h3>${title}</h3><p>${words[lang].issued}: ${ar?g.issuerAr:g.issuer}</p></div></article>`}).join('');return `<section class="issuer" id="${g.id}"><div class="issuer-head"><h2>${ar?g.issuerAr:g.issuer}</h2><span>${g.items.length} ${words[lang].count}</span></div><div class="gallery">${cards}</div></section>`}).join('');wrap.querySelectorAll('.cert-open').forEach(btn=>btn.addEventListener('click',()=>openLb(Number(btn.dataset.index))))}
function openLb(i){currentIndex=i;showLb();lightbox.classList.add('open');document.body.classList.add('lightbox-open');document.getElementById('lbClose').focus()}function showLb(){lbImage.src=flat[currentIndex].src;lbImage.alt=flat[currentIndex].title+' certificate';counter.textContent=`${currentIndex+1} / ${flat.length}`}function move(step){currentIndex=(currentIndex+step+flat.length)%flat.length;showLb()}function closeLb(){lightbox.classList.remove('open');document.body.classList.remove('lightbox-open');lbImage.removeAttribute('src')}function setLanguage(next){lang=next==='ar'?'ar':'en';const ar=lang==='ar';document.documentElement.lang=lang;document.documentElement.dir=ar?'rtl':'ltr';document.body.dir=ar?'rtl':'ltr';document.querySelector('[data-i18n=back]').textContent=words[lang].back;document.querySelector('[data-i18n=kicker]').textContent=words[lang].kicker;document.querySelector('[data-i18n=title]').textContent=words[lang].title;document.querySelector('[data-i18n=intro]').textContent=words[lang].intro;document.getElementById('filterLabel').textContent=words[lang].filter;document.getElementById('langBtn').textContent=ar?'English':'العربية';localStorage.setItem('portfolio-lang',lang);renderFilters();render()}document.getElementById('langBtn').addEventListener('click',()=>setLanguage(lang==='en'?'ar':'en'));document.getElementById('lbClose').addEventListener('click',closeLb);document.getElementById('lbPrev').addEventListener('click',()=>move(-1));document.getElementById('lbNext').addEventListener('click',()=>move(1));lightbox.addEventListener('click',e=>{if(e.target===lightbox)closeLb()});document.addEventListener('keydown',e=>{if(!lightbox.classList.contains('open'))return;if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});document.getElementById('year').textContent=new Date().getFullYear();setLanguage(lang);
