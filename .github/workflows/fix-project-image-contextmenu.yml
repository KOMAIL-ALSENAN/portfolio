name: Fix Project Image Context Menu
on:
  push:
    branches: [fix/project-image-contextmenu-20260902]
permissions:
  contents: write
jobs:
  red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-image-contextmenu-20260902
      - name: RED - prove browser can still target project images
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('assets/js/project-gallery.js').read_text(encoding='utf-8')
          assert 'PROJECT_IMAGE_TARGET_SHIELD_V2' not in s
          assert 'pointerEvents="none"' not in s
          print('RED confirmed: project images are still pointer targets')
          PY
      - name: Apply minimal target-shield fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/js/project-gallery.js')
          s=p.read_text(encoding='utf-8')
          marker='/* PROJECT_IMAGE_TARGET_SHIELD_V2 */'
          if marker not in s:
              s += '''\n/* PROJECT_IMAGE_TARGET_SHIELD_V2 */\n(()=>{\n  'use strict';\n  const isProjectImage=img=>img instanceof HTMLImageElement&&(img.src.includes('/assets/projects/')||img.closest('[data-pg-image],.pg-card,.lightbox,.pg-lightbox'));\n  const shield=img=>{if(!isProjectImage(img))return;img.draggable=false;img.style.pointerEvents="none";img.style.webkitUserDrag="none";img.style.userSelect="none";};\n  const scan=root=>{if(root instanceof HTMLImageElement)shield(root);root.querySelectorAll?.('img').forEach(shield);};\n  scan(document);\n  new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)scan(n)}))).observe(document.documentElement,{childList:true,subtree:true});\n  document.addEventListener('contextmenu',e=>{const protectedHost=e.target.closest?.('[data-pg-image],.pg-card,.lightbox,.pg-lightbox');if(protectedHost)e.preventDefault();},true);\n  document.addEventListener('dragstart',e=>{if(e.target.closest?.('[data-pg-image],.pg-card,.lightbox,.pg-lightbox'))e.preventDefault();},true);\n})();\n'''
              p.write_text(s,encoding='utf-8')
          PY
      - name: GREEN - verify image target shield
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('assets/js/project-gallery.js').read_text(encoding='utf-8')
          required=['PROJECT_IMAGE_TARGET_SHIELD_V2','pointerEvents="none"','MutationObserver','contextmenu','[data-pg-image],.pg-card,.lightbox,.pg-lightbox','draggable=false']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing: '+', '.join(missing))
          print('GREEN: project image elements can no longer be direct pointer/context-menu targets')
          PY
      - name: Commit fix and remove one-time workflow
        run: |
          rm .github/workflows/fix-project-image-contextmenu.yml
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add assets/js/project-gallery.js .github/workflows/fix-project-image-contextmenu.yml
          git commit -m "fix: prevent direct browser image context menus"
          git push