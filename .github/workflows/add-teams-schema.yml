name: Add Teams schema.org link preview metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-teams-schema.yml'

permissions:
  contents: write

jobs:
  add-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Article JSON-LD to every HTML page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          base = 'https://komail-alsenan.github.io/portfolio/'
          image = base + 'assets/social-card-v1.jpg'

          def meta_value(text, key, attr='property'):
              m = re.search(rf'<meta\s+{attr}=["\']{re.escape(key)}["\']\s+content=["\']([^"\']*)["\']', text, re.I)
              return m.group(1).strip() if m else ''

          for p in sorted(Path('.').glob('*.html')):
              text = p.read_text(encoding='utf-8')
              text = re.sub(r'\n?<script\s+type=["\']application/ld\+json["\']\s+data-social-schema=["\']true["\']>.*?</script>\n?', '\n', text, flags=re.I|re.S)

              title = meta_value(text, 'og:title')
              if not title:
                  m = re.search(r'<title>(.*?)</title>', text, re.I|re.S)
                  title = re.sub(r'\s+', ' ', m.group(1)).strip() if m else 'KOMAIL ALSENAN | Architecture BIM Modeler'
              desc = meta_value(text, 'og:description') or meta_value(text, 'description', 'name') or 'Architecture BIM Modeler specializing in Revit, multidisciplinary coordination and BIM automation.'
              url = meta_value(text, 'og:url')
              if not url:
                  url = base if p.name == 'index.html' else base + p.name

              schema = {
                  '@context': 'https://schema.org',
                  '@type': 'Article',
                  'name': title,
                  'headline': title,
                  'description': desc,
                  'image': image,
                  'url': url,
                  'creator': {
                      '@type': 'Person',
                      'name': 'Komail Alsenan',
                      'jobTitle': 'Architecture BIM Modeler'
                  },
                  'author': {
                      '@type': 'Person',
                      'name': 'Komail Alsenan'
                  }
              }
              block = '<script type="application/ld+json" data-social-schema="true">\n' + json.dumps(schema, ensure_ascii=False, indent=2) + '\n</script>\n'
              text = text.replace('</head>', block + '</head>', 1)
              p.write_text(text, encoding='utf-8')
              print('schema added:', p)
          PY

      - name: Remove this one-time workflow
        shell: bash
        run: rm -f .github/workflows/add-teams-schema.yml

      - name: Commit schema metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add schema.org rich link metadata for Teams"
          git push origin HEAD:main
