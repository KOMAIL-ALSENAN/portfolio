name: Build Teams optimized social preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-teams-preview.yml'

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create 1200x630 Teams-safe preview
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          cat > /tmp/preview.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
            <defs>
              <linearGradient id="left" x1="0" x2="1"><stop stop-color="#20b8ff"/><stop offset="1" stop-color="#1264d8"/></linearGradient>
              <radialGradient id="glow" cx="80%" cy="0%" r="65%"><stop stop-color="#143b61"/><stop offset="1" stop-color="#06101d"/></radialGradient>
            </defs>
            <rect width="1200" height="630" fill="#06101d"/>
            <rect width="360" height="630" fill="url(#left)"/>
            <rect x="360" width="840" height="630" fill="url(#glow)"/>
            <rect x="62" y="145" width="236" height="240" rx="44" fill="#071524" stroke="#d9f7ff" stroke-width="4"/>
            <text x="180" y="325" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="122" font-weight="800" fill="#55ddff">KA</text>
            <text x="62" y="456" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="800" fill="#ffffff">PORTFOLIO</text>
            <text x="430" y="225" font-family="DejaVu Sans,Arial,sans-serif" font-size="54" font-weight="800" fill="#f1f8ff">KOMAIL ALSENAN</text>
            <text x="430" y="290" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" fill="#52d8ff">Architecture BIM Modeler</text>
            <text x="430" y="355" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" fill="#b8cce0">BIM Specialist | Revit Automation</text>
            <line x1="430" y1="395" x2="1090" y2="395" stroke="#2f5b84" stroke-width="2"/>
            <text x="430" y="458" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#dcebf8">Revit | BIM Coordination | Automation</text>
            <text x="430" y="525" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#8fa9c2">komail-alsenan.github.io/portfolio</text>
          </svg>
          SVG
          convert -background none /tmp/preview.svg -resize 1200x630! assets/social-preview-teams-v4.png
          identify assets/social-preview-teams-v4.png

      - name: Update static and shared metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          old_urls = [
            'https://komail-alsenan.github.io/portfolio/assets/social-preview.png?v=2',
            'https://komail-alsenan.github.io/portfolio/assets/social-preview-v3.png',
            'https://komail-alsenan.github.io/portfolio/assets/social-preview.png',
          ]
          new = 'https://komail-alsenan.github.io/portfolio/assets/social-preview-teams-v4.png'
          for filename in ['index.html','assets/js/main.js']:
              p=Path(filename)
              t=p.read_text(encoding='utf-8')
              for old in old_urls:
                  t=t.replace(old,new)
              p.write_text(t,encoding='utf-8')
          PY

      - name: Commit preview and metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social-preview-teams-v4.png index.html assets/js/main.js
          git commit -m "Use Teams optimized social preview v4"
          git push origin HEAD:main
