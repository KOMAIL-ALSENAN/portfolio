name: Optimize NUPCO gallery

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/projects/nupco/building-01/**'
      - 'scripts/optimize_nupco.py'
      - '.github/workflows/optimize-nupco.yml'

permissions:
  contents: write

concurrency:
  group: optimize-nupco-main
  cancel-in-progress: false

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Build optimized WebP gallery and static manifest
        run: python scripts/optimize_nupco.py --max-dimension 1600 --quality 82 --replace-source

      - name: Commit optimized gallery
        run: |
          if git diff --quiet -- assets/projects/nupco/building-01 assets/projects/nupco/building-01-web; then
            echo 'No image changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/projects/nupco/building-01 assets/projects/nupco/building-01-web
          git commit -m 'Optimize NUPCO warehouse gallery assets'
          git pull --rebase origin main
          git push origin HEAD:main
