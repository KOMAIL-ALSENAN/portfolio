name: Browser Visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'assets/projects/**'
      - 'tests/visual_qa.mjs'
      - '.github/workflows/visual-qa.yml'

permissions:
  contents: read

jobs:
  browser-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Start local portfolio server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/portfolio-http.log 2>&1 &
          echo $! > /tmp/portfolio-http.pid

      - name: Run browser visual QA
        run: node tests/visual_qa.mjs

      - name: Publish QA summary
        if: always()
        run: |
          if [ -f artifacts/visual-qa/report.md ]; then
            cat artifacts/visual-qa/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-visual-qa
          path: artifacts/visual-qa
          if-no-files-found: warn
          retention-days: 14
