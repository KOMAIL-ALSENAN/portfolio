name: Build Experience Timeline
on:
  push:
    branches: [feature/experience-timeline-20260902]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build homepage integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --branch feature/experience-timeline-20260902 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          if grep -q 'assets/js/experience.js' index.html; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="assets/js/main.js"></script>'
          if marker not in s:
              raise SystemExit('main.js marker not found')
          s=s.replace(marker, marker+'\n<script src="assets/js/experience.js"></script>',1)
          schema='  "jobTitle": "Architecture BIM Modeler",\n'
          extra='  "jobTitle": "Architecture BIM Modeler",\n  "hasOccupation": {"@type": "Occupation", "name": "BIM Modeler"},\n  "worksFor": {"@type": "Organization", "name": "GULF CONSULT Architects & Engineers"},\n'
          if schema in s and '"worksFor"' not in s:
              s=s.replace(schema,extra,1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 .github/scripts/test_experience.py || true
          grep -q 'assets/js/experience.js' index.html
          grep -q '"worksFor"' index.html
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m 'Integrate Experience timeline on homepage'
          git push origin HEAD:feature/experience-timeline-20260902
