name: Interior Cover Diagnostic
on:
  pull_request:
    branches: [main]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect candidate cover files
        shell: bash
        run: |
          set -euxo pipefail
          file "assets/projects/interior-design/1.jpg"
          file "assets/projects/interior-design/2.jpg"
          file "assets/projects/interior-design/3.jpg"
          file "assets/projects/health-gym/health-gym-cover.jpg"
          stat -c '%n %s bytes' "assets/projects/interior-design/1.jpg" "assets/projects/interior-design/2.jpg" "assets/projects/interior-design/3.jpg" "assets/projects/health-gym/health-gym-cover.jpg"
          python3 - <<'PY'
          from pathlib import Path
          for p in [
              Path('assets/projects/interior-design/1.jpg'),
              Path('assets/projects/interior-design/2.jpg'),
              Path('assets/projects/interior-design/3.jpg'),
              Path('assets/projects/health-gym/health-gym-cover.jpg'),
          ]:
              b = p.read_bytes()
              print(p, 'head=', b[:16].hex(), 'tail=', b[-16:].hex(), 'soi=', b[:2] == b'\xff\xd8', 'eoi=', b[-2:] == b'\xff\xd9')
          PY
      - name: Inspect live GitHub Pages responses
        shell: bash
        run: |
          set -euxo pipefail
          base='https://komail-alsenan.github.io/portfolio'
          for path in \
            'assets/projects/interior-design/1.jpg' \
            'assets/projects/interior-design/2.jpg' \
            'assets/projects/interior-design/3.jpg' \
            'assets/projects/health-gym/health-gym-cover.jpg'; do
            echo "=== $path ==="
            curl -sS -L -o /tmp/out.bin -D /tmp/headers.txt -w 'http=%{http_code} type=%{content_type} bytes=%{size_download} url=%{url_effective}\n' "$base/$path?diag=${GITHUB_SHA}"
            cat /tmp/headers.txt
            file /tmp/out.bin
            stat -c '%s bytes downloaded' /tmp/out.bin
          done
