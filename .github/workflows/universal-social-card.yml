name: Build universal social card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/universal-social-card.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate universal 1200x630 JPEG card
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p assets
          cat > /tmp/social-card.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#0b67d1"/>
                <stop offset="0.42" stop-color="#074b9a"/>
                <stop offset="1" stop-color="#071827"/>
              </linearGradient>
            </defs>
            <rect width="1200" height="630" fill="url(#bg)"/>
            <rect width="390" height="630" fill="#0b79d0"/>
            <circle cx="195" cy="250" r="126" fill="#061525" stroke="#8de9ff" stroke-width="5"/>
            <text x="195" y="292" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="118" font-weight="800" fill="#5be0ff">KA</text>
            <text x="195" y="440" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#ffffff">BIM PORTFOLIO</text>
            <text x="460" y="208" font-family="DejaVu Sans,Arial,sans-serif" font-size="56" font-weight="800" fill="#ffffff">KOMAIL ALSENAN</text>
            <text x="460" y="284" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="700" fill="#67e2ff">Architecture BIM Modeler</text>
            <text x="460" y="350" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" fill="#e1eef8">BIM Specialist | Revit Automation</text>
            <line x1="460" y1="398" x2="1090" y2="398" stroke="#6da8d4" stroke-width="2" opacity="0.8"/>
            <text x="460" y="462" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#d5e7f6">Revit | BIM Coordination | Dynamo | Revit API</text>
            <text x="460" y="526" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#a9c6dc">komail-alsenan.github.io/portfolio</text>
          </svg>
          SVG
          convert -background white /tmp/social-card.svg -colorspace sRGB -alpha off -quality 92 assets/social-card-v1.jpg
          identify assets/social-card-v1.jpg
          identify -format '%w x %h | %[colorspace]\n' assets/social-card-v1.jpg

      - name: Standardize social metadata across every HTML page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          base = 'https://komail-alsenan.github.io/portfolio/'
          image = base + 'assets/social-card-v1.jpg'
          alt = 'KOMAIL ALSENAN — Architecture BIM Modeler portfolio'

          def set_meta(text, attr, key, value):
              pattern = rf'<meta\s+{attr}=["\']{re.escape(key)}["\']\s+content=["\'][^"\']*["\']\s*/?>'
              tag = f'<meta {attr}="{key}" content="{value}">'
              if re.search(pattern, text, flags=re.I):
                  return re.sub(pattern, tag, text, flags=re.I)
              return text.replace('</title>', '</title>\n' + tag, 1)

          for p in sorted(Path('.').glob('*.html')):
              text = p.read_text(encoding='utf-8')
              text = set_meta(text, 'property', 'og:image', image)
              text = set_meta(text, 'property', 'og:image:secure_url', image)
              text = set_meta(text, 'property', 'og:image:type', 'image/jpeg')
              text = set_meta(text, 'property', 'og:image:width', '1200')
              text = set_meta(text, 'property', 'og:image:height', '630')
              text = set_meta(text, 'property', 'og:image:alt', alt)
              text = set_meta(text, 'name', 'twitter:card', 'summary_large_image')
              text = set_meta(text, 'name', 'twitter:image', image)
              text = set_meta(text, 'name', 'twitter:image:alt', alt)
              text = set_meta(text, 'name', 'robots', 'index,follow,max-image-preview:large')

              image_src = f'<link rel="image_src" href="{image}">'
              if re.search(r'<link\s+rel=["\']image_src["\'][^>]*>', text, flags=re.I):
                  text = re.sub(r'<link\s+rel=["\']image_src["\'][^>]*>', image_src, text, flags=re.I)
              else:
                  text = text.replace('</head>', image_src + '\n</head>', 1)

              p.write_text(text, encoding='utf-8')
              print('updated', p)

          js = Path('assets/js/main.js')
          if js.exists():
              text = js.read_text(encoding='utf-8')
              text = re.sub(r"preview:'https://komail-alsenan\.github\.io/portfolio/assets/[^']+'", f"preview:'{image}'", text)
              text = text.replace("meta('og:image:type','image/png',true)", "meta('og:image:type','image/jpeg',true)")
              if "meta('twitter:image:alt'" not in text:
                  text = text.replace("meta('twitter:image',SITE.preview);", "meta('twitter:image',SITE.preview);meta('twitter:image:alt','KOMAIL ALSENAN — Architecture BIM Modeler portfolio');")
              js.write_text(text, encoding='utf-8')
          PY

      - name: Remove obsolete preview assets and temporary workflows
        shell: bash
        run: |
          rm -f assets/social-preview.png assets/social-preview-v3.png assets/social-preview-teams-v4.png
          rm -f .github/workflows/build-teams-preview.yml .github/workflows/refresh-social-preview.yml
          rm -f .github/workflows/universal-social-card.yml

      - name: Commit universal social sharing setup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Standardize universal social sharing preview"
          git push origin HEAD:main
