name: Apply Project Image Protection
on:
  push:
    branches:
      - feature/project-image-protection-20260902
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/project-image-protection-20260902
      - name: Add centralized project image protection
        shell: bash
        run: echo '' | base64 -d >> assets/js/project-gallery.js
      - name: Verify protection
        shell: bash
        run: grep -q PROJECT_IMAGE_PROTECTION_V1 assets/js/project-gallery.js && grep -q contextmenu assets/js/project-gallery.js && grep -q dragstart assets/js/project-gallery.js && grep -q imageRendering assets/js/project-gallery.js && ! grep -qi watermark assets/js/project-gallery.js
      - name: Commit implementation
        shell: bash
        run: rm .github/workflows/apply-project-image-protection.yml && git config user.name github-actions-bot && git config user.email github-actions-bot@users.noreply.github.com && git add assets/js/project-gallery.js .github/workflows/apply-project-image-protection.yml && git commit -m 'Protect published project images from casual copying' && git push origin HEAD:feature/project-image-protection-20260902