name: Apply Project Image Protection
on:
  push:
    branches:
      - feature/project-image-protection-20260902
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/project-image-protection-20260902
      - name: Add centralized project image protection
        shell: bash
        run: |
          cat >> assets/js/project-gallery.js <<'EOF'

/* PROJECT_IMAGE_PROTECTION_V1 - deterrence for published project imagery; original image bytes and quality are unchanged. */
(()=>{
  'use strict';
  const PROJECT_SRC='assets/projects/';
  const isProjectImage=(node)=>{
    if(!(node instanceof HTMLImageElement)) return false;
    const src=node.getAttribute('src')||'';
    return src.includes(PROJECT_SRC)||node.matches('.lightbox img');
  };
  const protect=(img)=>{
    if(!isProjectImage(img)) return;
    img.draggable=false;
    img.setAttribute('draggable','false');
    img.style.userSelect='none';
    img.style.webkitUserSelect='none';
    img.style.webkitUserDrag='none';
    img.style.imageRendering='auto';
    img.dataset.projectProtected='true';
  };
  const protectAll=()=>document.querySelectorAll('img').forEach(protect);
  document.addEventListener('contextmenu',(e)=>{if(isProjectImage(e.target))e.preventDefault();},true);
  document.addEventListener('dragstart',(e)=>{if(isProjectImage(e.target))e.preventDefault();},true);
  document.addEventListener('copy',(e)=>{if(isProjectImage(e.target))e.preventDefault();},true);
  document.addEventListener('keydown',(e)=>{
    const k=(e.key||'').toLowerCase();
    if((e.ctrlKey||e.metaKey)&&(k==='s'||k==='c'||k==='u')&&document.querySelector('img[src*="assets/projects/"]'))e.preventDefault();
  },true);
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',protectAll,{once:true});else protectAll();
  new MutationObserver(protectAll).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['src']});
})();
EOF
      - name: Verify protection
        shell: bash
        run: |
          grep -q PROJECT_IMAGE_PROTECTION_V1 assets/js/project-gallery.js
          grep -q contextmenu assets/js/project-gallery.js
          grep -q dragstart assets/js/project-gallery.js
          grep -q imageRendering assets/js/project-gallery.js
          if grep -qi watermark assets/js/project-gallery.js; then exit 1; fi
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/apply-project-image-protection.yml
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add assets/js/project-gallery.js .github/workflows/apply-project-image-protection.yml
          git commit -m 'Protect published project images from casual copying'
          git push origin HEAD:feature/project-image-protection-20260902