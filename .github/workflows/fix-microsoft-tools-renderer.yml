name: Microsoft Tools Source Fix

on:
  push:
    branches:
      - fix/microsoft-tools-renderer-20260903

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/microsoft-tools-renderer-20260903
          fetch-depth: 0
      - name: Patch actual homepage renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/js/main.js')
          s=p.read_text(encoding='utf-8')
          old=[
            "pdfType:'WINDOWS · PRODUCTIVITY SUITE'",
            "pdfTitle:'Toolbox Suite'",
            "pdfText:'A Windows productivity suite by BIM Specialist Software for practical file and document workflows, with Microsoft Store licensing, subscriptions and dedicated product support.'",
            "pdfLink:'Visit Toolbox Suite ↗'",
            "pdfType:'WINDOWS · حزمة إنتاجية'",
            "pdfTitle:'Toolbox Suite'",
            "pdfText:'حزمة إنتاجية لنظام Windows من BIM Specialist Software لتسهيل سير عمل الملفات والمستندات، مع ترخيص واشتراكات عبر Microsoft Store ودعم مخصص للمنتج.'",
            "pdfLink:'زيارة Toolbox Suite ↗'",
            '<div class="tool-icon tool-icon-pdf">TBX</div>',
            'href="https://bimspecialist.github.io/toolbox-suite-support/"'
          ]
          missing=[x for x in old if x not in s]
          if missing:
              raise SystemExit('RED source pattern missing: '+repr(missing))
          replacements={
            "pdfType:'WINDOWS · PRODUCTIVITY SUITE'":"pdfType:'WINDOWS · MICROSOFT STORE APPS'",
            "pdfTitle:'Toolbox Suite'":"pdfTitle:'Microsoft Tools'",
            "pdfText:'A Windows productivity suite by BIM Specialist Software for practical file and document workflows, with Microsoft Store licensing, subscriptions and dedicated product support.'":"pdfText:'The official hub for Windows applications by BIM Specialist Software, including product pages, documentation, support, privacy and updates for Microsoft Store apps.'",
            "pdfLink:'Visit Toolbox Suite ↗'":"pdfLink:'Visit Microsoft Tools ↗'",
            "pdfType:'WINDOWS · حزمة إنتاجية'":"pdfType:'WINDOWS · تطبيقات MICROSOFT STORE'",
            "pdfText:'حزمة إنتاجية لنظام Windows من BIM Specialist Software لتسهيل سير عمل الملفات والمستندات، مع ترخيص واشتراكات عبر Microsoft Store ودعم مخصص للمنتج.'":"pdfText:'البوابة الرسمية لتطبيقات Windows من BIM Specialist Software، وتشمل صفحات المنتجات وأدلة الاستخدام والدعم والخصوصية والتحديثات لتطبيقات Microsoft Store.'",
            "pdfLink:'زيارة Toolbox Suite ↗'":"pdfLink:'زيارة Microsoft Tools ↗'",
            '<div class="tool-icon tool-icon-pdf">TBX</div>':'<div class="tool-icon tool-icon-pdf">MS</div>',
            'href="https://bimspecialist.github.io/toolbox-suite-support/"':'href="https://bimspecialist.github.io/microsoft-tools/"'
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify corrected renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('assets/js/main.js').read_text(encoding='utf-8')
          required=['Microsoft Tools','WINDOWS · MICROSOFT STORE APPS','https://bimspecialist.github.io/microsoft-tools/','>MS</div>','زيارة Microsoft Tools']
          forbidden=['toolbox-suite-support/']
          missing=[x for x in required if x not in s]
          bad=[x for x in forbidden if x in s]
          if missing or bad: raise SystemExit('Verification failed: missing='+repr(missing)+' forbidden='+repr(bad))
          print('GREEN: actual homepage renderer now targets Microsoft Tools')
          PY
      - name: Commit source fix
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add assets/js/main.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: update homepage renderer to Microsoft Tools'
          git push origin HEAD:fix/microsoft-tools-renderer-20260903
