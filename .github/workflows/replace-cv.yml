name: Replace CV
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  replace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace CV references and remove old file
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old='assets/documents/Komail-Al-Senan-CV.pdf'
          new='assets/documents/Komail Jaffar Al Senan-Architectural BIM Modeler.pdf'
          for f in ['index.html','README.md']:
              p=Path(f)
              if p.exists():
                  s=p.read_text(encoding='utf-8')
                  s=s.replace(old,new)
                  s=s.replace('Komail-Al-Senan-CV.pdf','Komail Jaffar Al Senan-Architectural BIM Modeler.pdf')
                  p.write_text(s,encoding='utf-8')
          PY
          test -f 'assets/documents/Komail Jaffar Al Senan-Architectural BIM Modeler.pdf'
          git rm -f 'assets/documents/Komail-Al-Senan-CV.pdf'
          rm -f .github/workflows/replace-cv.yml
      - name: Verify
        shell: bash
        run: |
          ! grep -R --exclude-dir=.git -F 'Komail-Al-Senan-CV.pdf' .
          grep -F 'Komail Jaffar Al Senan-Architectural BIM Modeler.pdf' index.html
          test -f 'assets/documents/Komail Jaffar Al Senan-Architectural BIM Modeler.pdf'
          test ! -f 'assets/documents/Komail-Al-Senan-CV.pdf'
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace old CV with updated Architectural BIM Modeler CV'
          git push origin HEAD:main