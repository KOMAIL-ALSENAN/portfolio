name: Apply SKETCHUP Image Galleries
on:
  push:
    branches:
      - feature/sketchup-image-galleries
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply SKETCHUP image galleries') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sketchup-image-galleries
          fetch-depth: 0
      - run: python3 scripts/apply_sketchup_galleries.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.html sketchup.html sketchup-building-01.html sketchup-building-02.html
          git commit -m "apply SKETCHUP image galleries"
          git push origin HEAD:feature/sketchup-image-galleries
