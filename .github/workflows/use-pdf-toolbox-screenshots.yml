name: Use PDF Toolbox screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/use-pdf-toolbox-screenshots.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use uploaded screenshots
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pdf-toolbox-v9.html')
          t=p.read_text(encoding='utf-8')
          style='''<style id="pdf-real-screenshots">.real-shot{width:100%;aspect-ratio:1.4/1;object-fit:cover;object-position:top;display:block;background:#eee}.shot-ui{display:none!important}@media(max-width:620px){.real-shot{aspect-ratio:auto}}</style>'''
          if 'id="pdf-real-screenshots"' not in t:
              t=t.replace('</head>',style+'\n</head>',1)
          images=[
            ('assets/tools/pdf-toolbox-v9/overview-health-duplicates.png','PDF Toolbox V9 Health and Duplicates interface'),
            ('assets/tools/pdf-toolbox-v9/crop-pdf-images.png','PDF Toolbox V9 Crop and PDF to Images interface'),
            ('assets/tools/pdf-toolbox-v9/about-screen.png','PDF Toolbox V9 About and capabilities interface'),
          ]
          for src,alt in images:
              marker='<div class="shot-ui">'
              if src not in t:
                  t=t.replace(marker,f'<img class="real-shot" src="{src}" alt="{alt}" loading="lazy" decoding="async">'+marker,1)
          p.write_text(t,encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/use-pdf-toolbox-screenshots.yml

      - name: Commit screenshot integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show PDF Toolbox screenshots on tool page"
          git push origin HEAD:main
