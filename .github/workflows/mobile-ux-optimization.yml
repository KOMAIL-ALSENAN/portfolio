name: Mobile UX Regression

on:
  push:
    branches:
      - fix/mobile-ux-optimization-20260903

permissions:
  contents: write

jobs:
  test-and-implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mobile UX optimization
        run: |
          cat >> assets/css/main.css <<'EOF'

/* MOBILE_UX_OPTIMIZATION_V1
   Mobile-only polish for 320-620px screens. Desktop layout remains unchanged. */
@media(max-width:620px){
  html,body{max-width:100%;overflow-x:hidden}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  section{padding-block:56px!important}
  .hero{min-height:auto!important;padding-block:40px!important}
  .hero h1,h1{font-size:clamp(2.35rem,12vw,3.25rem)!important;line-height:1.02!important;letter-spacing:-.035em!important;overflow-wrap:anywhere}
  .lead{font-size:1rem!important;line-height:1.72!important}
  .section-head{margin-bottom:24px!important;gap:14px!important}
  .section-head h2{font-size:clamp(1.8rem,9vw,2.45rem)!important;line-height:1.12!important}
  .actions{gap:10px!important;margin-top:22px!important}
  .actions>.btn,.about-card .btn,.contact .btn,.tool-link,.project-link{width:100%;min-height:48px;justify-content:center;text-align:center}
  .visual{max-width:360px;width:100%;margin-inline:auto;border-radius:22px!important}
  .status{left:12px!important;right:12px!important;bottom:12px!important;padding:11px 12px!important;font-size:.8rem!important}
  .project,.about-card,.contact,.experience-card,.developed-tool-card{border-radius:17px!important}
  .contact{gap:18px!important}
  .site-nav .nav-inner{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
  .site-brand-copy{max-width:min(52vw,180px)!important}
  .site-brand-name,.site-role{overflow:hidden;text-overflow:ellipsis}
  .links{max-height:calc(100dvh - 72px);overflow-y:auto;overscroll-behavior:contain;padding-bottom:max(10px,env(safe-area-inset-bottom))!important}
  .lightbox{padding-top:max(8px,env(safe-area-inset-top))!important;padding-right:max(8px,env(safe-area-inset-right))!important;padding-bottom:max(8px,env(safe-area-inset-bottom))!important;padding-left:max(8px,env(safe-area-inset-left))!important}
  .lightbox-stage{width:100%!important;height:calc(100dvh - 16px)!important}
  .lightbox img{max-width:100%!important;max-height:82dvh!important}
  .lb{width:44px!important;height:44px!important}
  .counter{max-width:calc(100vw - 90px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .experience-item{min-width:0}
  .experience-card{min-width:0;overflow-wrap:anywhere}
  .experience-card h3{font-size:1.14rem!important;line-height:1.3}
  .experience-company,.experience-location{overflow-wrap:anywhere}
  .developed-tool-card{gap:16px!important}
  .developed-tool-card h3{font-size:1.24rem!important}
  .developed-tool-card p{font-size:.91rem!important;line-height:1.7}
  .project-media img,.gallery img,.certificate img{max-width:100%!important}
}
@media(max-width:380px){
  section{padding-block:48px!important}
  .hero{padding-block:34px!important}
  .hero h1,h1{font-size:clamp(2.15rem,12.5vw,2.7rem)!important}
  .container{width:min(100% - 22px,1120px)!important}
  .site-brand-copy{max-width:150px!important}
  .site-specialty{display:none!important}
  .experience-card,.developed-tool-card,.about-detail-card{padding:17px!important}
}
EOF
      - name: GREEN - run mobile UX regression test
        run: python3 tests/mobile_ux_regression.py
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/main.css
          git commit -m 'Optimize Portfolio mobile UX'
          git push origin HEAD:fix/mobile-ux-optimization-20260903
