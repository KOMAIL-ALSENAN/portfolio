name: Mobile UX Regression

on:
  push:
    branches:
      - fix/mobile-ux-optimization-20260903

permissions:
  contents: write

jobs:
  test-and-implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mobile UX optimization
        run: echo '' | base64 -d >> assets/css/main.css
      - name: GREEN - run mobile UX regression test
        run: python3 tests/mobile_ux_regression.py
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/main.css
          git commit -m 'Optimize Portfolio mobile UX [skip ci]'
          git push origin HEAD:fix/mobile-ux-optimization-20260903
