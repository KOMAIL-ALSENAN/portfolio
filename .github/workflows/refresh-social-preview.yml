name: Refresh social preview metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-social-preview.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Open Graph preview URL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'https://komail-alsenan.github.io/portfolio/assets/social-preview.png?v=2': 'https://komail-alsenan.github.io/portfolio/assets/social-preview-v3.png',
              'https://komail-alsenan.github.io/portfolio/assets/social-preview.png?v=3': 'https://komail-alsenan.github.io/portfolio/assets/social-preview-v3.png',
              'https://komail-alsenan.github.io/portfolio/assets/social-preview.png': 'https://komail-alsenan.github.io/portfolio/assets/social-preview-v3.png',
          }

          for filename in ['index.html', 'assets/js/main.js']:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          image_line = '<meta property="og:image" content="https://komail-alsenan.github.io/portfolio/assets/social-preview-v3.png">'
          secure_line = '<meta property="og:image:secure_url" content="https://komail-alsenan.github.io/portfolio/assets/social-preview-v3.png">'
          alt_line = '<meta property="og:image:alt" content="KOMAIL ALSENAN — Architecture BIM Modeler portfolio preview">'
          if secure_line not in text:
              text = text.replace(image_line, image_line + '\n' + secure_line + '\n' + alt_line)
          index.write_text(text, encoding='utf-8')
          PY

      - name: Commit refreshed metadata
        shell: bash
        run: |
          if git diff --quiet -- index.html assets/js/main.js; then
            echo "No metadata changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/js/main.js
          git commit -m "Use unique social preview v3 URL"
          git push origin HEAD:main
