5,.2);background:rgba(5,11,20,.78);color:white;min-width:46px;min-height:46px;border-radius:12px;cursor:pointer;font-size:1.3rem}.lb-close{top:18px;right:18px}.lb-prev{left:18px;top:50%;transform:translateY(-50%)}.lb-next{right:18px;top:50%;transform:translateY(-50%)}.lb-count{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);padding:6px 12px;border-radius:99px;background:rgba(5,11,20,.78);color:#dcecff}.footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted)}html[dir="rtl"] body{font-family:Tahoma,"Segoe UI",Arial,sans-serif;text-align:right}html[dir="rtl"] .kicker{letter-spacing:0}@media(max-width:700px){.container{width:min(100% - 24px,1180px)}.nav-inner{min-height:62px}.actions .back-all{display:none}.hero{padding-top:44px}.gallery{grid-template-columns:1fr;gap:12px}.lightbox{padding:8px}.lb-prev{left:8px}.lb-next{right:8px}.lb-close{top:8px;right:8px}}

<body>
<nav class="nav" aria-label="Primary navigation"><div class="container nav-inner"><a class="brand" href="index.html">KA · KOMAIL ALSENAN</a><div class="actions"><a class="btn back-all" href="projects.html" data-en="All Projects" data-ar="كل المشاريع">All Projects</a><a class="btn" href="sketchup.html" data-en="← SKETCHUP" data-ar="SKETCHUP →">← SKETCHUP</a><button class="btn" id="langBtn" type="button" aria-label="Switch language">العربية</button></div></div></nav>
<main><header class="hero"><div class="container"><span class="kicker" data-en="SKETCHUP · BUILDING GALLERY" data-ar="SKETCHUP · معرض المبنى">SKETCHUP · BUILDING GALLERY</span><h1 data-en="Building 01" data-ar="المبنى 01">Building 01</h1><p data-en="Architectural SketchUp modeling and presentation views for Building 01." data-ar="لقطات نمذجة وإظهار معماري باستخدام SketchUp للمبنى 01.">Architectural SketchUp modeling and presentation views for Building 01.</p><div class="count" data-en="12 project images" data-ar="12 صورة للمشروع">12 project images</div></div></header><section class="container gallery" id="gallery" data-gallery aria-label="Building 01 image gallery"></section></main>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image lightbox"><button class="lb-btn lb-close" id="lbClose" type="button" aria-label="Close">×</button><button class="lb-btn lb-prev" id="lbPrev" type="button" aria-label="Previous image">‹</button><img id="lbImage" alt=""><button class="lb-btn lb-next" id="lbNext" type="button" aria-label="Next image">›</button><div class="lb-count" id="lbCount"></div></div>
<footer class="footer"><div class="container">© <span id="year"></span> Komail Jaffar Al Senan · Architecture BIM Modeler</div></footer>
<script>
(()=>{const images=[
'assets/projects/sketchup/building-01/WhatsApp Image 2026-09-03 at 1.21.01 PM.jpeg',
'assets/projects/sketchup/building-01/WhatsApp Image 2026-09-03 at 1.21.04 PM (1).jpeg',
'assets/projects/sketchup/building-01/WhatsApp Image 2026-09-03 at 1.21.04 PM (2).jpeg',
'assets/projects/sketchup/building-01/WhatsApp Image 2026-09-03 at 1.21.04 PM.jpeg',
'assets/projects/sketchup/building-01/WhatsApp Image 2026-09-03 at 1.21.05 PM (1).jpeg',
'assets/projects/sketchup/building-01/WhatsApp Image 2026-09-03 at 1.21.05 PM.jpeg',
'assets/projects/sketchup/building-01/WhatsApp Image 2026-09-03 at 1.21.06 PM (1).jpeg',
'assets/projects/sketchup/building-01/WhatsApp Image 2026-09-03 at 1.21.06 PM (2).jpeg',
'assets/projects/sketchup/building-01/WhatsApp Image 2026-09-03 at 1.21.06 PM.jpeg',
'assets/projects/sketchup/building-01/WhatsApp Image 2026-09-03 at 1.21.07 PM.jpeg',
'assets/projects/sketchup/building-01/WhatsApp Image 2026-09-03 at 1.21.08 PM (1).jpeg',
'assets/projects/sketchup/building-01/WhatsApp Image 2026-09-03 at 1.21.08 PM.jpeg'];
const root=document.documentElement,langBtn=document.getElementById('langBtn'),gallery=document.getElementById('gallery'),lightbox=document.getElementById('lightbox'),lbImage=document.getElementById('lbImage'),lbCount=document.getElementById('lbCount');let current=0,touchX=null;
function renderGallery(){gallery.innerHTML=images.map((src,i)=>`<button type="button" data-index="${i}" aria-label="Open image ${i+1} of ${images.length}"><img src="${src}" alt="Building 01 SketchUp view ${i+1}" loading="lazy" decoding="async"></button>`).join('');gallery.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>open(Number(b.dataset.index))))}
function apply(next){const lang=next==='ar'?'ar':'en',ar=lang==='ar';root.lang=lang;root.dir=ar?'rtl':'ltr';document.body.dir=root.dir;document.querySelectorAll('[data-en][data-ar]').forEach(el=>el.textContent=el.getAttribute(ar?'data-ar':'data-en'));langBtn.textContent=ar?'English':'العربية';localStorage.setItem('portfolio-lang',lang);localStorage.setItem('portfolio-language',lang)}
function show(){lbImage.src=images[current];lbImage.alt=`Building 01 SketchUp view ${current+1}`;lbCount.textContent=`${current+1} / ${images.length}`}
function open(i){current=i;show();lightbox.classList.add('open');document.body.style.overflow='hidden';document.getElementById('lbClose').focus()}
function close(){lightbox.classList.remove('open');document.body.style.overflow=''}function move(step){current=(current+step+images.length)%images.length;show()}
document.getElementById('lbClose').onclick=close;document.getElementById('lbPrev').onclick=()=>move(-1);document.getElementById('lbNext').onclick=()=>move(1);lightbox.addEventListener('click',e=>{if(e.target===lightbox)close()});document.addEventListener('keydown',e=>{if(!lightbox.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')move(root.dir==='rtl'?1:-1);if(e.key==='ArrowRight')move(root.dir==='rtl'?-1:1)});lightbox.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX},{passive:true});lightbox.addEventListener('touchend',e=>{if(touchX===null)return;const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>45)move(dx<0?1:-1);touchX=null},{passive:true});
renderGallery();apply(localStorage.getItem('portfolio-lang')||localStorage.getItem('portfolio-language')||'en');langBtn.onclick=()=>apply(root.lang==='ar'?'en':'ar');document.getElementById('year').textContent=new Date().getFullYear()})();
</script>
<script src="assets/js/project-image-protection.js"></script>
